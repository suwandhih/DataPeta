<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Indonesia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ================= PETA (layar penuh) ================= -->
  <main class="peta" id="peta">
    <!-- Peta digambar dari data batas provinsi asli (data/peta-indonesia.js).
         Semua offline — tanpa internet. -->
    <svg id="petaSvg" class="peta-svg" viewBox="0 0 1000 400"
         preserveAspectRatio="xMidYMid meet" aria-label="Peta Indonesia">
      <g id="viewport">
        <!-- Urutan lapisan = urutan tampil (bawah ke atas).
             Provinsi dulu, baru danau/sungai, supaya air tidak tertutup
             warna provinsi. -->
        <g id="lapisNegara"></g>
        <g id="lapisProvinsi"></g>
        <g id="lapisDanau"></g>
        <g id="lapisSungai"></g>
        <g id="lapisGunung"></g>
        <g id="lapisKota"></g>
        <g id="lapisPenanda"></g>
      </g>
    </svg>

    <div class="zoom-kendali">
      <button id="zoomMasuk" aria-label="Perbesar">+</button>
      <button id="zoomKeluar" aria-label="Perkecil">−</button>
      <button id="zoomReset" aria-label="Kembalikan">⟲</button>
    </div>

    <div class="label-sementara" id="labelPeta">Memuat peta…</div>
  </main>

  <!-- ================= KOTAK PENCARIAN (kiri atas) ================= -->
  <div class="pencarian">
    <svg class="pencarian-ikon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input type="text" id="kotakCari" placeholder="Cari lokasi di peta…" autocomplete="off" />
    <button class="pencarian-hapus" id="hapusCari" title="Hapus" aria-label="Hapus pencarian">×</button>
  </div>

  <!-- ================= TOMBOL MENU (kanan atas) ================= -->
  <button class="tombol-menu" id="tombolMenu" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <!-- ================= TOMBOL TAMBAH LOKASI ================= -->
  <button class="tombol-tambah" id="tombolTambah" aria-label="Tambah lokasi">
    <span class="tombol-tambah-ikon">+</span> Tambah Lokasi
  </button>

  <!-- ================= BAR KATEGORI (bawah) ================= -->
  <nav class="kategori" id="kategori" aria-label="Kategori lokasi"></nav>

  <!-- ================= PANEL RINCIAN (kanan) ================= -->
  <aside class="panel" id="panel" aria-hidden="true">
    <button class="panel-tutup" id="panelTutup" aria-label="Tutup panel">×</button>
    <div class="panel-isi" id="panelIsi"></div>
  </aside>

  <!-- ================= MENU LACI (kanan) ================= -->
  <aside class="laci" id="laci" aria-hidden="true">
    <button class="laci-tutup" id="laciTutup" aria-label="Tutup menu">×</button>
    <h2 class="laci-judul">Peta Indonesia</h2>
    <ul class="laci-daftar">
      <li><button data-aksi="tentang">Tentang aplikasi</button></li>
      <li><button data-aksi="bantuan">Bantuan</button></li>
      <li><button data-aksi="data">Data lokasi</button></li>
    </ul>
    <div class="laci-awan">
      <p class="laci-awan-judul">Data Awan (pindah PC ↔ HP)</p>
      <button class="laci-awan-tombol" id="tombolKirim">↑ Kirim ke Awan</button>
      <button class="laci-awan-tombol" id="tombolTarik">↓ Ambil dari Awan</button>
      <p class="laci-awan-status" id="awanStatus"></p>
    </div>
    <p class="laci-catatan">Versi kerangka UI · Tahap 1</p>
  </aside>

  <div class="tirai" id="tirai"></div>

  <!-- ================= FORM ISIAN DATA ================= -->
  <div class="form-lokasi" id="formLokasi" aria-hidden="true">
    <div class="form-kotak">
      <button class="form-tutup" id="formTutup" aria-label="Tutup form">×</button>
      <h2 class="form-judul" id="formJudul">Tambah Lokasi Baru</h2>

      <label class="form-label">Nama lokasi</label>
      <input class="form-input" id="fNama" type="text" placeholder="Contoh: Yayasan Cahaya Nusantara" />

      <label class="form-label">Wilayah (provinsi / kabupaten / kota)</label>
      <input class="form-input" id="fWilayah" type="text" placeholder="Contoh: Jakarta Pusat, DKI Jakarta" />

      <label class="form-label">Kategori</label>
      <select class="form-input" id="fKategori"></select>

      <div class="form-baris2">
        <div>
          <label class="form-label">Bujur (lon)</label>
          <input class="form-input" id="fLon" type="number" step="0.0001" placeholder="106.83" />
        </div>
        <div>
          <label class="form-label">Lintang (lat)</label>
          <input class="form-input" id="fLat" type="number" step="0.0001" placeholder="-6.18" />
        </div>
      </div>

      <label class="form-label">Inisial penanda (2 huruf)</label>
      <input class="form-input" id="fInisial" type="text" maxlength="3" placeholder="CN" />

      <label class="form-label">Keterangan (satu per baris, format: Nama = Isi)</label>
      <textarea class="form-input form-area" id="fRincian" rows="5" placeholder="Berdiri = 2015&#10;Bidang = Pendidikan anak"></textarea>
      <button class="form-tombol-kecil" id="tombolRincian" type="button">+ Tambah baris keterangan</button>

      <div class="form-aksi">
        <button class="form-tombol form-tombol-hapus" id="formHapus" type="button">Hapus</button>
        <button class="form-tombol form-tombol-batal" id="formBatal" type="button">Batal</button>
        <button class="form-tombol form-tombol-simpan" id="formSimpan" type="button">Simpan</button>
      </div>
    </div>
  </div>

  <script src="data/negara-dunia.js"></script>
  <script src="data/peta-indonesia.js"></script>
  <script src="data/sungai.js"></script>
  <script src="data/danau.js"></script>
  <script src="data/gunung.js"></script>
  <script src="data/kota-indonesia.js"></script>
  <script src="data/contoh-lokasi.js"></script>
  <script src="js/penyimpanan.js"></script>
  <script src="js/awan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
